title:
  en: Double Pendulum
  es: Doble Péndulo
finished: finished
descriptionShort:
  en: This project was intended as a one-day coding session and ended up with me playing with the results for three days. The chaos generated by a double pendulum system is quite interesting. The math behind it is simple, involving just two (albeit large) equations. The visuals are amazing and, when properly tweaked, can mesmerize you.
  es: Este proyecto iba a ser una prueba rápida de un día, pero terminé jugando con los resultados durante tres. El caos generado por un sistema de doble péndulo es realmente fascinante. Las matemáticas detrás son relativamente simples, con solo dos ecuaciones (aunque algo largas), y los resultados visuales pueden llegar a ser hipnóticos si se ajustan bien.
descriptionLong:
  en: |
    This project was intended as a one-day coding session to practice Python, Pygame, and NumPy, and ended up with me playing with the results for three days. The chaos generated by a double pendulum system is quite interesting. The math behind it is simple, involving just two (albeit large) equations. The visuals are amazing and, when properly tweaked, can mesmerize you. Simulations can be customized with a few buttons, and if you give it some time, you can modify the code to enhance it further!
  es: |
    Este proyecto iba a ser una prueba rápida de un día con Python, Pygame y NumPy, pero al final estuve experimentando con él durante tres días. El caos que genera un sistema de doble péndulo es realmente interesante. Las matemáticas son relativamente simples, basadas en dos ecuaciones algo largas, pero los resultados visuales pueden ser alucinantes. La simulación es personalizable con algunos botones y, si te animas, puedes modificar el código para seguir mejorándolo.
